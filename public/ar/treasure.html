<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
    <title>AR 보물 발견</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.8/aframe/build/aframe-ar.js"></script>
    <style>
      html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#050806;font-family:system-ui,sans-serif}
      .guide{position:fixed;z-index:10;top:14px;left:50%;width:max-content;max-width:86%;transform:translateX(-50%);padding:9px 14px;border-radius:999px;background:rgba(19,41,25,.86);color:#fff1a8;font-size:13px;font-weight:900;text-align:center}
      .collect{position:fixed;z-index:10;left:50%;bottom:24px;transform:translateX(-50%);width:min(86%,360px);height:52px;border:2px solid #71480d;border-radius:13px;background:#f4c64f;color:#38240b;font:900 16px system-ui;box-shadow:0 8px 25px rgba(0,0,0,.42);display:none}
      .collect.visible{display:block;animation:pop .45s ease-out}
      .back{position:fixed;z-index:10;top:62px;left:14px;padding:8px 11px;border:1px solid rgba(255,255,255,.5);border-radius:9px;background:rgba(0,0,0,.58);color:white;font:800 12px system-ui;text-decoration:none}
      @keyframes pop{from{opacity:0;transform:translateX(-50%) scale(.7)}to{opacity:1;transform:translateX(-50%) scale(1)}}
      .a-enter-vr{display:none!important}
    </style>
  </head>
  <body>
    <div id="guide" class="guide">Hiro AR 마커를 카메라에 비춰주세요</div>
    <a class="back" href="/?ar-return=1">게임으로 돌아가기</a>
    <button id="collect" class="collect" type="button">보물 획득하기</button>
    <a-scene embedded vr-mode-ui="enabled:false" renderer="antialias:true;alpha:true" arjs="sourceType:webcam;trackingMethod:best;debugUIEnabled:false;">
      <a-assets><img id="treasure" src="/reward-treasure-small.png?asset=individual-v2" crossorigin="anonymous" /></a-assets>
      <a-marker id="hiro-marker" preset="hiro" emitevents="true" smooth="true" smooth-count="10" smooth-tolerance="0.01" smooth-threshold="5">
        <a-entity id="hint-content"><a-sphere position="0 0.45 0" radius="0.26" color="#fff078" material="emissive:#ffc928;emissiveIntensity:1" animation="property:position;dir:alternate;to:0 0.65 0;loop:true;dur:700;easing:easeInOutSine"></a-sphere></a-entity>
        <a-entity id="treasure-content"><a-ring position="0 0.03 0" rotation="-90 0 0" radius-inner="0.66" radius-outer="0.76" color="#ffd84d" material="opacity:.82;transparent:true" animation="property:rotation;to:-90 0 360;loop:true;dur:3500;easing:linear"></a-ring><a-image src="#treasure" position="0 0.48 0" rotation="-90 0 0" width="1.35" height="1.05" material="transparent:true" animation="property:position;dir:alternate;to:0 0.62 0;loop:true;dur:900;easing:easeInOutSine"></a-image></a-entity>
      </a-marker>
      <a-entity camera></a-entity>
    </a-scene>
    <script>
      const marker=document.getElementById('hiro-marker');
      const guide=document.getElementById('guide');
      const collect=document.getElementById('collect');
      const mode=new URLSearchParams(location.search).get('mode')==='hint'?'hint':'treasure';
      const hintContent=document.getElementById('hint-content');
      const treasureContent=document.getElementById('treasure-content');
      hintContent.setAttribute('visible',mode==='hint');
      treasureContent.setAttribute('visible',mode==='treasure');
      const loadGame=()=>{try{return JSON.parse(localStorage.getItem('school-treasure-hunt-game')||'null')}catch{return null}};
      const saveAndReturn=(game)=>{localStorage.setItem('school-treasure-hunt-game',JSON.stringify(game));location.replace('/?ar-return=1')};
      if(mode==='hint')collect.textContent='힌트 확인하기';
      marker.addEventListener('markerFound',()=>{if(mode==='hint'){guide.textContent='힌트 마커 인식 완료!';collect.classList.add('visible')}else{guide.textContent='보물 발견! 마커 위에 나타났어요';collect.classList.add('visible')}});
      marker.addEventListener('markerLost',()=>{guide.textContent='마커가 화면에서 벗어났습니다';collect.classList.remove('visible')});
      collect.addEventListener('click',()=>{const game=loadGame();if(!game)return;if(mode==='hint'){saveAndReturn({...game,hintLevel:Math.min(3,game.hintLevel+1),screen:'hint'});return}const target=game.assignedTreasures[game.step];const collectedTreasures=[...new Set([...(game.collectedTreasures||[]),target])];saveAndReturn({...game,collectedTreasures,screen:'found'})});
    </script>
  </body>
</html>
